<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="18" viewBox="0 0 1000 18" role="img" aria-label="Blue divider with a subtle moving light">
  <path d="M0 9H1000" stroke="#4677b8" stroke-opacity=".38"/>
  <path d="M0 9H85" stroke="#6ba9ff" stroke-width="2"/>
  <circle cx="85" cy="9" r="3" fill="#9dccff">
    <animate attributeName="cx" values="85;145;85" dur="6s" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .2 1;.4 0 .2 1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
