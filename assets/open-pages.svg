<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Open the grimoire</title>
  <desc id="description">An open book of stained, torn, and crumpled parchment resting on a dark wooden desk.</desc>
  <defs>
    <linearGradient id="desk2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17110d"/><stop offset=".5" stop-color="#382419"/><stop offset="1" stop-color="#120e0c"/></linearGradient>
    <linearGradient id="left-page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7a666"/><stop offset=".12" stop-color="#ead7a5"/><stop offset=".85" stop-color="#f1dfb0"/><stop offset="1" stop-color="#a77b42"/></linearGradient>
    <linearGradient id="right-page" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#c09b5b"/><stop offset=".14" stop-color="#f0ddb0"/><stop offset=".86" stop-color="#e5ce99"/><stop offset="1" stop-color="#9b713d"/></linearGradient>
    <radialGradient id="stain"><stop stop-color="#7c4d22" stop-opacity="0"/><stop offset=".72" stop-color="#7c4d22" stop-opacity=".08"/><stop offset=".8" stop-color="#633b1b" stop-opacity=".23"/><stop offset=".86" stop-color="#7c4d22" stop-opacity=".05"/><stop offset="1" stop-color="#7c4d22" stop-opacity="0"/></radialGradient>
    <pattern id="fiber2" width="22" height="17" patternUnits="userSpaceOnUse"><path d="M0 5c8-4 12 4 22-2M2 14c6-3 12 2 18-2" fill="none" stroke="#583718" stroke-opacity=".07"/><circle cx="8" cy="9" r=".7" fill="#523216" opacity=".12"/></pattern>
    <filter id="page-shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-opacity=".7"/></filter>
    <style>
      .mark { animation: fade 4.5s ease-in-out infinite; }
      .page { animation: settle 7s ease-in-out infinite alternate; transform-origin: 600px 420px; }
      @keyframes fade { 50% { opacity: .38; } }
      @keyframes settle { to { transform: translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#desk2)"/>
  <g opacity=".18" stroke="#bc8351"><path d="M0 91h1200M0 338h1200"/><path d="M188 0v480M1015 0v480"/></g>
  <g class="page" filter="url(#page-shadow)">
    <path d="M81 89c65-50 146-48 237-31 106-20 196-16 282 32v330c-105-35-209-37-312-8-72-18-143-18-214 5l18-62-24-31 20-42-15-37 18-48-20-39Z" fill="url(#left-page)" stroke="#6c4724" stroke-width="3"/>
    <path d="M1119 89c-65-50-146-48-237-31-106-20-196-16-282 32v330c105-35 209-37 312-8 72-18 143-18 214 5l-18-62 24-31-20-42 15-37-18-48 20-39Z" fill="url(#right-page)" stroke="#6c4724" stroke-width="3"/>
    <path d="M600 90c-22 95-22 231 0 330" fill="none" stroke="#65421f" stroke-width="9" opacity=".5"/>
    <path d="M600 98c-10 98-10 213 0 314" fill="none" stroke="#f7e7bd" stroke-width="3" opacity=".55"/>
    <path d="M89 94c87-38 169-35 229-22 104-16 189-11 282 31M1111 94c-87-38-169-35-229-22-104-16-189-11-282 31" fill="none" stroke="#fff1ca" stroke-opacity=".55" stroke-width="3"/>
    <path d="M91 409c71-21 136-21 197-6 99-25 203-20 312 17M1109 409c-71-21-136-21-197-6-99-25-203-20-312 17" fill="none" stroke="#70471f" stroke-opacity=".5" stroke-width="4"/>
    <path d="M82 89c65-50 146-48 237-31 106-20 196-16 281 32v330c-105-35-209-37-312-8-72-18-143-18-214 5l18-62-24-31 20-42-15-37 18-48-20-39ZM1118 89c-65-50-146-48-237-31-106-20-196-16-281 32v330c105-35 209-37 312-8 72-18 143-18 214 5l-18-62 24-31-20-42 15-37-18-48 20-39Z" fill="url(#fiber2)"/>

    <g fill="none" stroke="#6f4c29" opacity=".16" stroke-width="1.5">
      <path d="M124 156c104-25 200 20 320-9s113 24 144 4M111 202c130 26 245-16 362 11s80-12 114-4M119 307c91-29 190 19 286-8s132 18 181 3"/>
      <path d="M1077 153c-115-23-223 20-330-7s-118 22-135 7M1092 246c-123 30-242-23-359 8s-99-15-121-5M1078 342c-108-28-203 13-320-7s-112 18-146 8"/>
    </g>

    <ellipse cx="199" cy="314" rx="68" ry="61" fill="url(#stain)" transform="rotate(-17 199 314)"/>
    <ellipse cx="983" cy="157" rx="79" ry="66" fill="url(#stain)" transform="rotate(22 983 157)"/>
    <path d="M352 65l16 20 18-18 17 17 20-15 18 12" fill="none" stroke="#6b4521" stroke-width="3"/>
    <path d="m803 68 13 19 21-15 16 18 19-18 18 11" fill="none" stroke="#6b4521" stroke-width="3"/>

    <g fill="#4b3320" text-anchor="middle" font-family="Georgia,serif">
      <text x="343" y="155" font-size="17" letter-spacing="5">THE ARCHIVE OF</text>
      <text x="343" y="216" font-size="45" font-weight="700">GEO CEFF</text>
      <path d="M181 239h324" stroke="#76502c"/>
      <text x="343" y="278" font-size="17" font-style="italic">Tools · systems · worlds</text>
      <text x="858" y="158" font-size="18" letter-spacing="4">READER'S INSTRUCTION</text>
      <path d="M712 181h292" stroke="#76502c"/>
      <text x="858" y="230" font-size="24" font-style="italic">Turn the pages below</text>
      <text x="858" y="269" font-size="16">Each seal reveals another record.</text>
    </g>
    <g class="mark" fill="none" stroke="#406866" opacity=".66" transform="translate(858 332)">
      <circle r="39"/><circle r="29"/><path d="M0-29 25 15h-50Z"/><circle r="6" fill="#406866"/>
    </g>
  </g>
</svg>
