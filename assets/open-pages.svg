<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Open the grimoire</title>
  <desc id="description">An open book of stained, torn, and crumpled parchment resting on a dark wooden desk.</desc>
  <defs>
    <linearGradient id="desk2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17110d"/><stop offset=".5" stop-color="#382419"/><stop offset="1" stop-color="#120e0c"/></linearGradient>
    <linearGradient id="left-page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5428"/><stop offset=".1" stop-color="#bd7e3e"/><stop offset=".28" stop-color="#d5a25d"/><stop offset=".7" stop-color="#d9ab68"/><stop offset=".9" stop-color="#bd7c3d"/><stop offset="1" stop-color="#75421f"/></linearGradient>
    <linearGradient id="right-page" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#814b23"/><stop offset=".1" stop-color="#b87438"/><stop offset=".3" stop-color="#d7a461"/><stop offset=".72" stop-color="#d1a060"/><stop offset=".91" stop-color="#b16f34"/><stop offset="1" stop-color="#70401f"/></linearGradient>
    <radialGradient id="stain"><stop stop-color="#633816" stop-opacity="0"/><stop offset=".68" stop-color="#633816" stop-opacity=".07"/><stop offset=".78" stop-color="#4d2911" stop-opacity=".31"/><stop offset=".85" stop-color="#7b451d" stop-opacity=".08"/><stop offset="1" stop-color="#633816" stop-opacity="0"/></radialGradient>
    <radialGradient id="blotch"><stop stop-color="#7b431a" stop-opacity=".2"/><stop offset=".55" stop-color="#9c5925" stop-opacity=".09"/><stop offset="1" stop-color="#9c5925" stop-opacity="0"/></radialGradient>
    <pattern id="fiber2" width="31" height="29" patternUnits="userSpaceOnUse"><path d="M0 5c8-4 15 4 31-2M3 14c11-5 17 3 27-2M0 25c9 3 17-4 31 0" fill="none" stroke="#4c2912" stroke-opacity=".13" stroke-width=".8"/><path d="M8 0c-2 8 3 17-1 29M24 0c3 9-2 18 1 29" fill="none" stroke="#f0c985" stroke-opacity=".07" stroke-width=".7"/><circle cx="11" cy="10" r=".8" fill="#42230f" opacity=".2"/></pattern>
    <filter id="paper-grit" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".018 .12" numOctaves="4" seed="17" result="noise"/><feColorMatrix in="noise" values=".55 0 0 0 .22  .35 0 0 0 .12  .15 0 0 0 .04  0 0 0 .28 0" result="brown-noise"/><feBlend in="SourceGraphic" in2="brown-noise" mode="multiply"/></filter>
    <filter id="page-shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-opacity=".7"/></filter>
    <style>
      .mark { animation: fade 4.5s ease-in-out infinite; }
      .page { animation: settle 7s ease-in-out infinite alternate; transform-origin: 600px 420px; }
      @keyframes fade { 50% { opacity: .38; } }
      @keyframes settle { to { transform: translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#desk2)"/>
  <g opacity=".18" stroke="#bc8351"><path d="M0 91h1200M0 338h1200"/><path d="M188 0v480M1015 0v480"/></g>
