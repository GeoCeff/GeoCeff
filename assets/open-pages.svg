    <g fill="#4b3320" text-anchor="middle" font-family="Georgia,serif">
      <text x="343" y="155" font-size="17" letter-spacing="5">THE ARCHIVE OF</text>
      <text x="343" y="216" font-size="45" font-weight="700">GEO CEFF</text>
      <path d="M181 239h324" stroke="#76502c"/>
      <text x="343" y="278" font-size="17" font-style="italic">Tools · systems · worlds</text>
      <text x="858" y="158" font-size="18" letter-spacing="4">READER'S INSTRUCTION</text>
      <path d="M712 181h292" stroke="#76502c"/>
      <text x="858" y="230" font-size="24" font-style="italic">Turn the pages below</text>
      <text x="858" y="269" font-size="16">Each seal reveals another record.</text>
    </g>
    <g class="mark" fill="none" stroke="#406866" opacity=".66" transform="translate(858 332)">
      <circle r="39"/><circle r="29"/><path d="M0-29 25 15h-50Z"/><circle r="6" fill="#406866"/>
    </g>
  </g>
</svg>
