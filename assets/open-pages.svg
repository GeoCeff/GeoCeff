    <path d="M1119 89c-65-50-146-48-237-31-106-20-196-16-282 32v330c105-35 209-37 312-8 72-18 143-18 214 5l-18-62 24-31-20-42 15-37-18-48 20-39Z" fill="url(#right-page)" stroke="#4d2913" stroke-width="5" filter="url(#paper-grit)"/>
