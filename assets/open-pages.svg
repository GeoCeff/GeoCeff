<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">The square parchment archive</title>
  <desc id="description">A square sheet of old sepia parchment with dark worn edges, stains, fibers, scratches, and faded ink.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17100d"/><stop offset=".5" stop-color="#3a2418"/><stop offset="1" stop-color="#100c0a"/></linearGradient>
    <radialGradient id="paper" cx="48%" cy="45%" r="72%"><stop stop-color="#d8ae70"/><stop offset=".5" stop-color="#cb9858"/><stop offset=".82" stop-color="#a96835"/><stop offset="1" stop-color="#693817"/></radialGradient>
    <radialGradient id="blotch"><stop stop-color="#6b3514" stop-opacity=".22"/><stop offset=".58" stop-color="#87481c" stop-opacity=".09"/><stop offset="1" stop-color="#87481c" stop-opacity="0"/></radialGradient>
    <radialGradient id="ring"><stop stop-color="#5e2e11" stop-opacity="0"/><stop offset=".7" stop-color="#5e2e11" stop-opacity=".06"/><stop offset=".79" stop-color="#4b240e" stop-opacity=".3"/><stop offset=".87" stop-color="#784018" stop-opacity=".06"/><stop offset="1" stop-color="#784018" stop-opacity="0"/></radialGradient>
    <pattern id="fibers" width="31" height="29" patternUnits="userSpaceOnUse"><path d="M0 5c8-4 15 4 31-2M3 14c11-5 17 3 27-2M0 25c9 3 17-4 31 0" fill="none" stroke="#48240f" stroke-opacity=".13" stroke-width=".8"/><path d="M8 0c-2 8 3 17-1 29M24 0c3 9-2 18 1 29" fill="none" stroke="#f0ca8a" stroke-opacity=".07" stroke-width=".7"/><circle cx="11" cy="10" r=".8" fill="#3d1e0c" opacity=".2"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#000" flood-opacity=".72"/></filter>
    <filter id="grit" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".018 .12" numOctaves="4" seed="17" result="noise"/><feColorMatrix in="noise" values=".55 0 0 0 .2  .33 0 0 0 .1  .14 0 0 0 .03  0 0 0 .25 0" result="brown"/><feBlend in="SourceGraphic" in2="brown" mode="multiply"/></filter>
    <style>
      .seal { animation: fade 4.8s ease-in-out infinite; }
      @keyframes fade { 50% { opacity: .42; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="800" height="800" rx="24" fill="url(#desk)"/>
  <g filter="url(#shadow)">
    <path d="M89 61 170 72l67-14 85 10 75-12 82 13 72-11 81 15 79-9 17 78-11 70 14 80-12 68 13 79-15 70 12 81-76 21-73-12-82 14-70-12-84 13-70-14-79 12-84-17 9-80-13-68 12-82-14-70 13-79-12-70Z" fill="url(#paper)" stroke="#54290f" stroke-width="7" filter="url(#grit)"/>
    <path d="M96 70 170 81l68-13 84 10 75-12 82 13 72-11 78 14 72-8 13 70-10 68 14 80-12 68 13 79-15 70 11 74-68 18-70-12-82 14-70-12-84 13-70-14-79 12-75-15 8-73-13-68 12-82-14-70 13-79-11-67Z" fill="none" stroke="#7b431d" stroke-opacity=".55" stroke-width="19"/>
    <path d="M104 79 171 90l68-12 83 9 75-11 82 12 72-10 72 13 67-7 9 62-9 67 14 79-12 68 13 78-14 69 8 66-61 15-68-11-82 13-70-11-84 12-70-13-79 11-67-13 7-65-12-68 11-81-13-70 12-78-10-65Z" fill="url(#fibers)"/>

    <ellipse cx="196" cy="205" rx="126" ry="102" fill="url(#blotch)" transform="rotate(-14 196 205)"/>
    <ellipse cx="606" cy="590" rx="147" ry="113" fill="url(#blotch)" transform="rotate(17 606 590)"/>
    <ellipse cx="615" cy="185" rx="78" ry="73" fill="url(#ring)" transform="rotate(12 615 185)"/>
    <ellipse cx="191" cy="610" rx="62" ry="68" fill="url(#ring)" transform="rotate(-22 191 610)"/>

    <g fill="none" stroke="#643014" stroke-opacity=".25" stroke-linecap="round">
      <path d="m126 133 148 12m-118 28 74-8m-105 424 170-19m-103 44 93-16m294-456 103 14m-82 33 67-7m-112 384 137 17m-169 41 104-22"/>
      <path d="M206 86c-15 122 20 216-4 329s13 172-2 296M593 79c18 108-15 221 8 331s-12 188 1 298" stroke-width="1.5"/>
      <path d="M112 325c150-35 247 25 394-7s134 22 181 5M118 470c122 31 242-28 370 8s153-21 199-9" stroke-width="1.2"/>
    </g>
    <g fill="none" stroke="#ecc483" stroke-opacity=".16"><path d="M132 107c117 22 211-18 324 4s148-14 215 3M131 682c108-17 203 22 321-2s154 16 218-2"/></g>

    <g fill="#4b2b18" text-anchor="middle" font-family="Georgia,serif">
      <text x="400" y="255" font-size="18" letter-spacing="7">THE ARCHIVE OF</text>
      <text x="400" y="344" font-size="58" font-weight="700" letter-spacing="3">GEO CEFF</text>
      <path d="M230 376h340" stroke="#65401f" stroke-width="2"/>
      <text x="400" y="433" font-size="24" font-style="italic">Turn the pages below</text>
      <text x="400" y="478" font-size="17">Each seal reveals another record.</text>
    </g>
    <g class="seal" fill="none" stroke="#315a56" opacity=".64" transform="translate(400 565)"><circle r="45" stroke-width="2"/><circle r="33"/><path d="M0-33 29 17h-58Z"/><circle r="7" fill="#315a56"/></g>
  </g>
</svg>
