<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Geo Gabaisen portfolio</title>
  <desc id="desc">A dark technical-atlas banner with blue grid lines and an orbital wireframe, matching Geo's portfolio website.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#090b10"/>
      <stop offset=".58" stop-color="#101824"/>
      <stop offset="1" stop-color="#0b2343"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#247dff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#247dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6ba9ff" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="1" fill="#6ba9ff" fill-opacity=".18"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#background)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <circle cx="788" cy="155" r="245" fill="url(#glow)"/>
    <path d="M0 319H1000M0 1H1000" stroke="#6ba9ff" stroke-opacity=".5"/>
    <path d="M42 46H95M42 46V91M958 46H905M958 46V91M42 274H95M42 274V229M958 274H905M958 274V229" fill="none" stroke="#6ba9ff" stroke-opacity=".7" stroke-width="2"/>
    <text x="70" y="83" fill="#8bbdff" font-family="Consolas,monospace" font-size="16" letter-spacing="4">VYNZER / PORTFOLIO</text>
    <path d="M70 100H450" stroke="#6ba9ff" stroke-opacity=".55"/>
    <text x="65" y="180" fill="#f5f8fc" font-family="Montserrat,Segoe UI,Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="2">GEO GABAISEN</text>
    <text x="70" y="220" fill="#aab4c2" font-family="Consolas,monospace" font-size="16" letter-spacing="1.7">STUDENT BUILDER / DATA INTERFACES / GAME SYSTEMS</text>
    <text x="70" y="258" fill="#6ba9ff" font-family="Consolas,monospace" font-size="12" letter-spacing="2">CEBU, PHILIPPINES  ·  LOCAL-FIRST BY DEFAULT</text>
    <g fill="none" stroke="#6ba9ff">
      <circle cx="797" cy="156" r="101" stroke-opacity=".18"/>
      <circle cx="797" cy="156" r="70" stroke-opacity=".65" stroke-width="1.5"/>
      <circle cx="797" cy="156" r="36" stroke-opacity=".42"/>
      <ellipse cx="797" cy="156" rx="134" ry="47" transform="rotate(-24 797 156)" stroke-opacity=".48"/>
      <ellipse cx="797" cy="156" rx="102" ry="102" transform="rotate(63 797 156)" stroke-dasharray="2 9" stroke-opacity=".4"/>
      <path d="M797 50V64M797 248V262M691 156H705M889 156H903" stroke-opacity=".7"/>
      <path d="M765 156H829M797 124V188" stroke-opacity=".28"/>
      <path d="m797 105 45 26v50l-45 26-45-26v-50z" stroke-opacity=".7" stroke-width="1.5"/>
      <path d="m797 105 0 102m-45-76 90 50m0-50-90 50" stroke-opacity=".28"/>
    </g>
    <circle cx="889" cy="109" r="4" fill="#9dccff"/>
    <circle cx="694" cy="175" r="2.5" fill="#9dccff"/>
    <rect x="1" y="1" width="998" height="318" rx="17" fill="none" stroke="#6ba9ff" stroke-opacity=".33" stroke-width="2"/>
  </g>
</svg>
