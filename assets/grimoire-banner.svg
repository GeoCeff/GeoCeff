<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Geo Ceff's Code Grimoire</title>
  <desc id="description">A weathered brown leather spellbook with brass corners, an embossed magic crest, scratches, and softly glowing runes.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#130f0d"/><stop offset=".5" stop-color="#2a1b14"/><stop offset="1" stop-color="#0e0c0b"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6b351c"/><stop offset=".26" stop-color="#9a572c"/><stop offset=".68" stop-color="#6d351d"/><stop offset="1" stop-color="#3b1b14"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6c4a20"/><stop offset=".4" stop-color="#d0aa59"/><stop offset=".7" stop-color="#8d642c"/><stop offset="1" stop-color="#4d3118"/>
    </linearGradient>
    <pattern id="grain" width="31" height="23" patternUnits="userSpaceOnUse">
      <path d="M0 7c8-5 16 5 31-2M5 19c7-4 13 3 23-2" fill="none" stroke="#e5ad66" stroke-opacity=".06"/>
      <circle cx="7" cy="11" r="1" fill="#170b08" opacity=".16"/>
    </pattern>
    <filter id="book-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sigil { transform-origin: 600px 246px; animation: breathe 4.8s ease-in-out infinite; }
      .inner { transform-origin: 600px 246px; animation: turn 28s linear infinite; }
      .dust { animation: drift 5s ease-in-out infinite alternate; }
      .dust:nth-of-type(2n) { animation-delay: -2s; }
      @keyframes breathe { 50% { opacity: .58; } }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes drift { to { transform: translate(7px,-9px); opacity: .2; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="500" rx="26" fill="url(#desk)"/>
  <g opacity=".2" stroke="#9f7044">
    <path d="M0 82h1200M0 314h1200"/><path d="M172 0v500M964 0v500"/>
  </g>
  <g class="dust" fill="#e7c477" opacity=".48">
    <circle cx="155" cy="104" r="2"/><circle cx="1032" cy="82" r="1.5"/><circle cx="1090" cy="384" r="2"/><circle cx="128" cy="407" r="1.4"/>
  </g>

  <g filter="url(#book-shadow)">
    <path d="M267 62h675l46 37v326l-31 23H252l-39-35V98Z" fill="#d6bd84"/>
    <path d="M234 48h690l38 35v326l-28 27H234l-28-27V78Z" fill="url(#leather)" stroke="#2b140e" stroke-width="9"/>
    <path d="M234 48h42v388h-42l-28-27V78Z" fill="#452018" opacity=".88"/>
    <path d="M278 72h620l37 30v282l-31 28H278Z" fill="none" stroke="url(#brass)" stroke-width="8"/>
    <path d="M299 93h584l29 24v251l-25 22H299Z" fill="url(#grain)" stroke="#28130e" stroke-width="3"/>
    <path d="M315 109h552l27 21v224l-23 19H315Z" fill="none" stroke="#d0aa59" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 8"/>

    <g fill="url(#brass)" stroke="#35200f" stroke-width="2">
      <path d="M232 50h92l-23 27-38 8-12 45-19 21Z"/><path d="M924 50h-92l23 27 38 8 12 45 19 21Z"/>
      <path d="M232 434h92l-23-27-38-8-12-45-19-21Z"/><path d="M924 434h-92l23-27 38-8 12-45 19-21Z"/>
    </g>

    <g class="sigil" fill="none" stroke="#d7bb72" filter="url(#glow)" opacity=".86">
      <circle cx="600" cy="246" r="88" stroke-width="3"/>
      <circle cx="600" cy="246" r="67" stroke-width="1.5"/>
      <g class="inner">
        <path d="m600 178 59 102H541Z"/><path d="m600 314-59-102h118Z"/>
        <circle cx="600" cy="178" r="4" fill="#d7bb72"/><circle cx="659" cy="280" r="4" fill="#d7bb72"/><circle cx="541" cy="280" r="4" fill="#d7bb72"/>
      </g>
      <circle cx="600" cy="246" r="13" fill="#d7bb72"/>
    </g>

    <g fill="#e0c680" text-anchor="middle" font-family="Georgia,serif">
      <text x="600" y="130" font-size="18" letter-spacing="7">THE CODEX ARCANA</text>
      <text x="600" y="374" font-size="42" font-weight="700" letter-spacing="5">GEO CEFF</text>
      <text x="600" y="403" font-size="14" font-style="italic" letter-spacing="3">VOLUME I · SOFTWARE &amp; STRANGE WORLDS</text>
    </g>

    <g fill="none" stroke="#341710" stroke-linecap="round" opacity=".5">
      <path d="m352 143 53 11m-35 39 74-8m-88 156 51-16m371-181 62 13m-44 179 72-21"/>
      <path d="M471 83c18 7 31-4 45 6M695 390c15-8 30 4 44-5" stroke-width="2"/>
    </g>
  </g>

  <path d="M1010 130c48 65 67 142 99 224" fill="none" stroke="#eee0bd" stroke-width="14" stroke-linecap="round"/>
  <path d="M1008 130c20 3 41 23 45 42-14-2-28 4-38 12 8 9 12 22 10 35" fill="none" stroke="#8a765a" stroke-width="2"/>
</svg>
