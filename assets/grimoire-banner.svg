<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">The adventurer's record of Geo Ceff</title>
  <desc id="description">An animated old parchment scroll with a magic circle, ink flourishes, and a wax seal.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead7a5"/>
      <stop offset=".26" stop-color="#f5e8c2"/>
      <stop offset=".7" stop-color="#e9d39c"/>
      <stop offset="1" stop-color="#cba96d"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c713f"/>
      <stop offset=".18" stop-color="#e5ca91"/>
      <stop offset=".48" stop-color="#f7e7ba"/>
      <stop offset=".82" stop-color="#b88c52"/>
      <stop offset="1" stop-color="#704622"/>
    </linearGradient>
    <radialGradient id="seal" cx="38%" cy="32%">
      <stop offset="0" stop-color="#b33e37"/>
      <stop offset=".58" stop-color="#7d211f"/>
      <stop offset="1" stop-color="#431415"/>
    </radialGradient>
    <radialGradient id="mana">
      <stop offset="0" stop-color="#427d7d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#427d7d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fibers" width="17" height="13" patternUnits="userSpaceOnUse">
      <path d="M0 3c5-2 9 2 17-1M2 11c4-2 8 1 14-1" fill="none" stroke="#6b4727" stroke-opacity=".055" stroke-width="1"/>
      <circle cx="4" cy="6" r=".65" fill="#5f3e22" opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f1208" flood-opacity=".48"/>
    </filter>
    <filter id="ink-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ring { transform-origin: 230px 210px; animation: turn 30s linear infinite; }
      .ring-back { transform-origin: 230px 210px; animation: turn-back 21s linear infinite; }
      .glyph { animation: pulse 4.2s ease-in-out infinite; }
      .spark { animation: glint 3.1s ease-in-out infinite alternate; }
      .spark:nth-of-type(2n) { animation-delay: -1.2s; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes turn-back { to { transform: rotate(-360deg); } }
      @keyframes pulse { 50% { opacity: .34; } }
      @keyframes glint { from { opacity: .18; } to { opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#21160d"/>
  <g filter="url(#shadow)">
    <path d="M71 53c22-30 61-37 92-22h875c31-15 69-8 91 22-19 25-19 289 0 314-22 30-60 37-91 22H163c-31 15-70 8-92-22 19-25 19-289 0-314Z" fill="url(#paper)"/>
    <path d="M91 53c18-19 45-22 68-8-14 78-14 252 0 330-23 14-50 11-68-8 15-74 15-240 0-314Z" fill="url(#roll)"/>
    <path d="M1109 53c-18-19-45-22-68-8 14 78 14 252 0 330 23 14 50 11 68-8-15-74-15-240 0-314Z" fill="url(#roll)"/>
    <path d="M148 42h904M148 378h904" stroke="#76512c" stroke-width="3" opacity=".62"/>
    <path d="M164 58h872v304H164z" fill="none" stroke="#68451f" stroke-width="1.5" stroke-dasharray="2 5" opacity=".55"/>
    <path d="M159 45h882v330H159z" fill="url(#fibers)"/>
  </g>

  <ellipse cx="230" cy="210" rx="185" ry="176" fill="url(#mana)"/>
  <g fill="none" stroke="#315f60" opacity=".72" filter="url(#ink-glow)">
    <circle cx="230" cy="210" r="111" stroke-width="2"/>
    <circle cx="230" cy="210" r="84" stroke-width="1.5"/>
    <g class="ring">
      <path d="M230 99 326 266H134Z"/>
      <circle cx="230" cy="99" r="4" fill="#315f60"/>
      <circle cx="326" cy="266" r="4" fill="#315f60"/>
      <circle cx="134" cy="266" r="4" fill="#315f60"/>
    </g>
    <g class="ring-back">
      <path d="m230 126 73 126H157Z" stroke="#6c4724"/>
      <path d="M119 210h222M230 99v222" stroke-width="1"/>
    </g>
    <path d="m230 157 46 80h-92Z" stroke="#3b2820" stroke-width="2"/>
    <circle cx="230" cy="210" r="13" fill="#315f60" opacity=".75"/>
  </g>

  <g class="glyph" fill="#62411f" font-family="Georgia,serif" font-size="18" text-anchor="middle">
    <text x="230" y="78">✦</text><text x="230" y="350">⌁</text>
    <text x="93" y="216">◇</text><text x="367" y="216">◇</text>
  </g>
  <g class="spark" fill="#315f60">
    <circle cx="410" cy="94" r="2"/><circle cx="530" cy="322" r="1.6"/>
    <circle cx="800" cy="78" r="1.8"/><circle cx="958" cy="302" r="1.5"/>
  </g>

  <g fill="#38271b">
    <text x="430" y="119" font-family="Georgia,serif" font-size="17" letter-spacing="5">THE ADVENTURER'S RECORD OF</text>
    <path d="M430 139h572" stroke="#72502e" stroke-width="1"/>
    <text x="426" y="222" font-family="Georgia,serif" font-size="74" font-weight="700" letter-spacing="4">GEO CEFF</text>
    <text x="432" y="262" font-family="Georgia,serif" font-size="20" font-style="italic" letter-spacing="2">Software craft · strange worlds · useful magic</text>
    <path d="M432 286c90 22 166-20 250 0s162-18 249 0" fill="none" stroke="#72502e" stroke-width="1.6"/>
  </g>

  <g transform="translate(982 304)">
    <circle r="43" fill="url(#seal)"/>
    <circle r="34" fill="none" stroke="#d78669" stroke-opacity=".48" stroke-width="2"/>
    <path d="M0-20 7-6l15 2-11 11 3 15L0 14l-14 8 3-15-11-11 15-2Z" fill="none" stroke="#e0a17f" stroke-width="2"/>
    <text y="6" text-anchor="middle" fill="#e9b094" font-family="Georgia,serif" font-size="17" font-weight="700">GC</text>
  </g>
</svg>
