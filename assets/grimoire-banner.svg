<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Geo Ceff's old leather code grimoire</title>
  <desc id="description">A portrait-shaped antique leather book with an ornate gold border, resting on a dark wooden writing desk beside an inkwell and quill.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17100d"/><stop offset=".34" stop-color="#50301f"/><stop offset=".7" stop-color="#352016"/><stop offset="1" stop-color="#120e0c"/>
    </linearGradient>
    <radialGradient id="lamplight" cx="45%" cy="42%" r="62%">
      <stop stop-color="#c88949" stop-opacity=".22"/><stop offset=".58" stop-color="#754525" stop-opacity=".08"/><stop offset="1" stop-color="#090706" stop-opacity=".42"/>
    </radialGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70502d"/><stop offset=".14" stop-color="#d2b783"/><stop offset=".74" stop-color="#e4d0a3"/><stop offset="1" stop-color="#79603a"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3a1b12"/><stop offset=".17" stop-color="#7b4125"/><stop offset=".5" stop-color="#9a5d31"/><stop offset=".79" stop-color="#71391f"/><stop offset="1" stop-color="#2b130e"/>
    </linearGradient>
    <linearGradient id="inset" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5b2c1c"/><stop offset=".5" stop-color="#814a29"/><stop offset="1" stop-color="#482117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4b3118"/><stop offset=".26" stop-color="#b98d49"/><stop offset=".48" stop-color="#e0bd70"/><stop offset=".72" stop-color="#8e642e"/><stop offset="1" stop-color="#382312"/>
    </linearGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#88775c"/><stop offset=".4" stop-color="#f1e4c4"/><stop offset=".74" stop-color="#c8b591"/><stop offset="1" stop-color="#6f604a"/>
    </linearGradient>
    <pattern id="woodgrain" width="210" height="54" patternUnits="userSpaceOnUse">
      <path d="M0 12c50-14 86 15 138-1s58 8 72 2M0 39c38 11 80-13 123 0s63-8 87-1" fill="none" stroke="#d19660" stroke-opacity=".09" stroke-width="2"/>
      <path d="M26 27c23-9 42 8 62-2" fill="none" stroke="#120b08" stroke-opacity=".14"/>
    </pattern>
    <pattern id="leathergrain" width="34" height="27" patternUnits="userSpaceOnUse">
      <path d="M0 8c8-6 17 5 34-2M5 22c9-5 17 3 26-3" fill="none" stroke="#efb16d" stroke-opacity=".07"/>
      <circle cx="9" cy="13" r="1" fill="#170a07" opacity=".19"/>
    </pattern>
    <filter id="shadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="16" dy="20" stdDeviation="17" flood-color="#050302" flood-opacity=".78"/>
    </filter>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="5" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <filter id="emboss" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant=".65" specularExponent="14" lighting-color="#efce8a" result="shine"><feDistantLight azimuth="225" elevation="42"/></feSpecularLighting>
      <feComposite in="shine" in2="SourceAlpha" operator="in" result="lit"/>
      <feMerge><feMergeNode in="lit"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dust { animation: drift 7s ease-in-out infinite alternate; }
      .glint { animation: glint 5s ease-in-out infinite; }
      @keyframes drift { to { transform: translate(8px,-10px); opacity: .16; } }
      @keyframes glint { 50% { opacity: .72; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#desk)"/>
  <rect width="1200" height="500" rx="24" fill="url(#woodgrain)"/>
  <rect width="1200" height="500" rx="24" fill="url(#lamplight)"/>
  <g opacity=".34" stroke="#1a0f0b" stroke-width="3"><path d="M0 132h1200M0 366h1200"/><path d="M181 0v500M1008 0v500"/></g>

  <g class="dust" fill="#e8c27b" opacity=".4">
    <circle cx="121" cy="96" r="1.8"/><circle cx="184" cy="392" r="1.2"/><circle cx="986" cy="67" r="1.5"/><circle cx="1097" cy="408" r="1.9"/>
  </g>

  <g transform="rotate(-3 500 250)" filter="url(#shadow)">
    <path d="M331 54 678 43l24 375-352 31-35-22Z" fill="url(#pages)" stroke="#312016" stroke-width="5"/>
    <path d="M350 423c101-4 234-15 350-29v24c-102 14-223 25-350 31Z" fill="#cbb07d"/>
    <g stroke="#7c633e" stroke-opacity=".55">
      <path d="M360 429c104-6 216-15 332-29M359 435c105-6 216-15 334-29M360 441c102-6 213-15 333-29"/>
    </g>

    <path d="M305 49 661 38l25 356-350 29-32-25Z" fill="url(#leather)" stroke="#24100c" stroke-width="9"/>
    <path d="M305 49 353 58l22 350-39 15-32-25Z" fill="#432016" opacity=".9"/>
    <path d="M318 54 662 43l20 348-337 25-22-23Z" fill="url(#leathergrain)"/>

    <path d="M352 75 632 66l19 295-278 21Z" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <path d="M369 91 617 83l16 261-245 19Z" fill="none" stroke="#32170f" stroke-width="5"/>
    <path d="M385 107 601 100l14 226-212 17Z" fill="url(#inset)" stroke="url(#gold)" stroke-width="4"/>
    <path d="M398 121 588 115l11 196-183 15Z" fill="url(#leathergrain)" stroke="#2b150f" stroke-width="2"/>

    <g fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#emboss)">
      <path d="M359 78q22 2 31 21-18 8-19 29m258-59q-21 4-28 23 18 7 20 27M376 380q19-4 27-23-18-7-20-27m265 32q-21-2-30-21 18-8 19-29"/>
      <path d="M371 130c-13 15-12 32 4 46-16 14-13 31 4 43-15 15-12 31 4 44-14 14-11 30 5 42"/>
      <path d="M624 119c15 13 15 29 2 44 16 12 16 29 2 43 16 13 16 29 2 44 16 12 15 29 1 43"/>
      <path d="M421 104c18 12 36 11 53-3 18 13 38 12 55-3 18 13 37 11 54-3M437 337c18-14 37-15 55-3 17-15 36-16 54-4 17-14 35-16 51-5"/>
    </g>
    <g fill="url(#gold)" stroke="#3a2412" stroke-width="1.5">
      <circle cx="367" cy="85" r="6"/><circle cx="626" cy="77" r="6"/><circle cx="386" cy="371" r="6"/><circle cx="642" cy="352" r="6"/>
      <circle cx="376" cy="148" r="3"/><circle cx="381" cy="244" r="3"/><circle cx="387" cy="320" r="3"/>
      <circle cx="623" cy="138" r="3"/><circle cx="628" cy="226" r="3"/><circle cx="633" cy="302" r="3"/>
    </g>

    <g fill="#2e160f" opacity=".45" stroke-linecap="round">
      <path d="m425 146 49-9m-54 36 68-5m-56 126 45-12m60-137 38 8m-56 119 62-17" stroke="#2e160f" stroke-width="2"/>
      <path d="M443 206c22-11 39 9 59-1s32 8 51 0M448 247c19 8 38-10 55 0s35-7 52 1" fill="none" stroke="#dca66a" stroke-opacity=".16"/>
    </g>

    <g class="glint" text-anchor="middle" font-family="Georgia,serif" fill="#b18a50" filter="url(#emboss)" opacity=".52">
      <text x="501" y="187" font-size="13" letter-spacing="5">THE ARCHIVE OF</text>
      <text x="507" y="260" font-size="34" font-weight="700" letter-spacing="4">GEO CEFF</text>
      <path d="M443 277h130" stroke="#a77c43"/>
      <text x="509" y="303" font-size="12" font-style="italic" letter-spacing="2">VOLUME I</text>
    </g>
  </g>

  <g transform="translate(822 82)" filter="url(#soft-shadow)">
    <ellipse cx="50" cy="35" rx="48" ry="18" fill="#0d0908" opacity=".7"/>
    <path d="M16 31h68l-8 57H24Z" fill="#1a1717" stroke="#6f5037" stroke-width="3"/>
    <ellipse cx="50" cy="31" rx="34" ry="12" fill="#080707" stroke="#8c6743" stroke-width="3"/>
    <ellipse cx="50" cy="32" rx="22" ry="6" fill="#15101c"/>
    <path d="M25 74h50l9 15H16Z" fill="#100d0c" stroke="#6f5037" stroke-width="2"/>
  </g>

  <g filter="url(#soft-shadow)">
    <path d="M861 382c54-95 108-184 184-276" fill="none" stroke="#6a5135" stroke-width="7" stroke-linecap="round"/>
    <path d="M1045 106c-52 6-93 49-110 95 22-9 40-5 53 7-26 8-47 25-60 51 18-8 34-5 45 5-30 19-64 64-112 118 73-54 110-83 133-116 10-14 15-31 14-51 21-27 34-64 37-109Z" fill="url(#quill)" stroke="#5a4936" stroke-width="2"/>
    <path d="M861 382c65-87 119-175 184-276" fill="none" stroke="#8a7350" stroke-width="2"/>
  </g>
</svg>
