<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Geo Ceff's old leather code grimoire</title>
  <desc id="description">A top-down view of an antique brown leather book with an ornate gold border, beside an inkwell and quill on a wooden desk.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17100d"/><stop offset=".38" stop-color="#50301f"/><stop offset=".72" stop-color="#352016"/><stop offset="1" stop-color="#120e0c"/></linearGradient>
    <radialGradient id="light" cx="45%" cy="42%" r="64%"><stop stop-color="#d49450" stop-opacity=".2"/><stop offset=".65" stop-color="#6a3c22" stop-opacity=".05"/><stop offset="1" stop-color="#080605" stop-opacity=".4"/></radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a1a12"/><stop offset=".2" stop-color="#754024"/><stop offset=".5" stop-color="#975a30"/><stop offset=".8" stop-color="#68331e"/><stop offset="1" stop-color="#29120d"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d2418"/><stop offset=".48" stop-color="#754025"/><stop offset="1" stop-color="#3a1a13"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#473017"/><stop offset=".3" stop-color="#b98e4c"/><stop offset=".5" stop-color="#dfbd73"/><stop offset=".75" stop-color="#8c622f"/><stop offset="1" stop-color="#35210f"/></linearGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#84745b"/><stop offset=".4" stop-color="#f0e3c4"/><stop offset=".75" stop-color="#c7b38e"/><stop offset="1" stop-color="#6a5b45"/></linearGradient>
    <pattern id="wood" width="210" height="54" patternUnits="userSpaceOnUse"><path d="M0 12c50-14 86 15 138-1s58 8 72 2M0 39c38 11 80-13 123 0s63-8 87-1" fill="none" stroke="#d19660" stroke-opacity=".09" stroke-width="2"/><path d="M26 27c23-9 42 8 62-2" fill="none" stroke="#120b08" stroke-opacity=".14"/></pattern>
    <pattern id="grain" width="34" height="27" patternUnits="userSpaceOnUse"><path d="M0 8c8-6 17 5 34-2M5 22c9-5 17 3 26-3" fill="none" stroke="#efb16d" stroke-opacity=".07"/><circle cx="9" cy="13" r="1" fill="#170a07" opacity=".19"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="8" dy="13" stdDeviation="14" flood-color="#050302" flood-opacity=".75"/></filter>
    <filter id="small-shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="4" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".7"/></filter>
    <filter id="emboss" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/><feSpecularLighting in="blur" surfaceScale="3" specularConstant=".6" specularExponent="13" lighting-color="#efce8a" result="shine"><feDistantLight azimuth="225" elevation="42"/></feSpecularLighting><feComposite in="shine" in2="SourceAlpha" operator="in" result="lit"/><feMerge><feMergeNode in="lit"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .dust { animation: drift 7s ease-in-out infinite alternate; }
      .glint { animation: glint 5s ease-in-out infinite; }
      @keyframes drift { to { transform: translate(8px,-10px); opacity: .16; } }
      @keyframes glint { 50% { opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#desk)"/>
  <rect width="1200" height="500" rx="24" fill="url(#wood)"/>
  <rect width="1200" height="500" rx="24" fill="url(#light)"/>
  <g opacity=".34" stroke="#1a0f0b" stroke-width="3"><path d="M0 132h1200M0 366h1200"/><path d="M181 0v500M1008 0v500"/></g>
  <g class="dust" fill="#e8c27b" opacity=".38"><circle cx="121" cy="96" r="1.8"/><circle cx="184" cy="392" r="1.2"/><circle cx="986" cy="67" r="1.5"/><circle cx="1097" cy="408" r="1.9"/></g>

  <g filter="url(#shadow)">
    <rect x="292" y="42" width="410" height="416" rx="7" fill="url(#leather)" stroke="#24100c" stroke-width="10"/>
    <rect x="307" y="57" width="380" height="386" rx="3" fill="url(#grain)"/>
    <rect x="326" y="75" width="342" height="350" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <rect x="344" y="93" width="306" height="314" fill="none" stroke="#28130e" stroke-width="5"/>
    <rect x="362" y="111" width="270" height="278" fill="url(#panel)" stroke="url(#gold)" stroke-width="4"/>
    <rect x="376" y="125" width="242" height="250" fill="url(#grain)" stroke="#2a140f" stroke-width="2"/>

    <g fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#emboss)">
      <path d="M334 83q23 2 31 22-19 8-20 30m315-52q-23 2-31 22 19 8 20 30M334 417q23-2 31-22-19-8-20-30m315 52q-23-2-31-22 19-8 20-30"/>
      <path d="M350 143c-15 14-15 31 0 45-15 14-15 31 0 45-15 14-15 31 0 45-15 14-15 31 0 45-15 14-15 31 0 45"/>
      <path d="M644 143c15 14 15 31 0 45 15 14 15 31 0 45 15 14 15 31 0 45 15 14 15 31 0 45 15 14 15 31 0 45"/>
      <path d="M390 99c18 14 37 14 55 0 18 14 37 14 55 0 18 14 37 14 55 0 18 14 37 14 55 0M390 401c18-14 37-14 55 0 18-14 37-14 55 0 18-14 37-14 55 0 18-14 37-14 55 0"/>
    </g>
    <g fill="url(#gold)" stroke="#38220f" stroke-width="1.5"><circle cx="336" cy="85" r="6"/><circle cx="658" cy="85" r="6"/><circle cx="336" cy="415" r="6"/><circle cx="658" cy="415" r="6"/><circle cx="350" cy="158" r="3"/><circle cx="350" cy="250" r="3"/><circle cx="350" cy="342" r="3"/><circle cx="644" cy="158" r="3"/><circle cx="644" cy="250" r="3"/><circle cx="644" cy="342" r="3"/></g>

    <g fill="none" stroke="#30150f" stroke-linecap="round" opacity=".48"><path d="m405 157 53-10m-56 38 72-7m-60 139 49-13m73-151 39 9m-57 133 67-18" stroke-width="2"/><path d="M426 221c22-11 39 9 59-1s32 8 51 0M429 270c19 8 38-10 55 0s35-7 52 1" stroke="#dca66a" stroke-opacity=".16"/></g>
    <g class="glint" text-anchor="middle" font-family="Georgia,serif" fill="#ad854c" filter="url(#emboss)" opacity=".5"><text x="497" y="197" font-size="13" letter-spacing="5">THE ARCHIVE OF</text><text x="497" y="271" font-size="34" font-weight="700" letter-spacing="4">GEO CEFF</text><path d="M432 289h130" stroke="#9e743e"/><text x="497" y="317" font-size="12" font-style="italic" letter-spacing="2">VOLUME I</text></g>
  </g>

  <g transform="translate(824 82)" filter="url(#small-shadow)"><ellipse cx="50" cy="35" rx="48" ry="18" fill="#0d0908" opacity=".7"/><path d="M16 31h68l-8 57H24Z" fill="#1a1717" stroke="#6f5037" stroke-width="3"/><ellipse cx="50" cy="31" rx="34" ry="12" fill="#080707" stroke="#8c6743" stroke-width="3"/><ellipse cx="50" cy="32" rx="22" ry="6" fill="#15101c"/><path d="M25 74h50l9 15H16Z" fill="#100d0c" stroke="#6f5037" stroke-width="2"/></g>
  <g filter="url(#small-shadow)"><path d="M861 382c54-95 108-184 184-276" fill="none" stroke="#6a5135" stroke-width="7" stroke-linecap="round"/><path d="M1045 106c-52 6-93 49-110 95 22-9 40-5 53 7-26 8-47 25-60 51 18-8 34-5 45 5-30 19-64 64-112 118 73-54 110-83 133-116 10-14 15-31 14-51 21-27 34-64 37-109Z" fill="url(#quill)" stroke="#5a4936" stroke-width="2"/><path d="M861 382c65-87 119-175 184-276" fill="none" stroke="#8a7350" stroke-width="2"/></g>
</svg>
