name: GitHub metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/github-metrics.svg
          user: GeoCeff
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Manila
          config_order: base.header, base.activity+community, isocalendar, languages, leetcode, repositories
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_leetcode: yes
          plugin_leetcode_user: Vinzr
          plugin_leetcode_sections: solved, skills, recent
          plugin_repositories: yes
          plugin_repositories_featured: GeoCeff/stock-tester-and-simulator, GeoCeff/perk-the-star, GeoCeff/chatgpt-thread-optimizer, GeoCeff/python-automation-toolkit
