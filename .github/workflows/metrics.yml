name: GitHub metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/github-metrics.svg
          user: GeoCeff
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Manila
          config_order: base.header, base.activity+community, isocalendar, languages, leetcode, repositories
          extras_css: |
            :root {
              --color-calendar-graph-day-L1-bg: #173d72 !important;
              --color-calendar-graph-day-L2-bg: #256bc4 !important;
              --color-calendar-graph-day-L3-bg: #4a92ff !important;
              --color-calendar-graph-day-L4-bg: #9dccff !important;
            }
            [fill="#9be9a8"] { fill: #173d72 !important; }
            [fill="#40c463"] { fill: #256bc4 !important; }
            [fill="#30a14e"] { fill: #4a92ff !important; }
            [fill="#216e39"] { fill: #9dccff !important; }
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_leetcode: yes
          plugin_leetcode_user: Vinzr
          plugin_leetcode_sections: solved, skills, recent
          plugin_repositories: yes
          plugin_repositories_featured: GeoCeff/stock-tester-and-simulator, GeoCeff/perk-the-star, GeoCeff/chatgpt-thread-optimizer, GeoCeff/python-automation-toolkit
