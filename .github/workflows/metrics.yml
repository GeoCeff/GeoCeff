name: GitHub metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          filename: data/github-metrics.svg
          output_action: none
          user: GeoCeff
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Manila
          config_order: base.header, base.activity+community, isocalendar, languages, leetcode, repositories
          extras_css: |
            :root {
              --color-calendar-graph-day-L1-bg: #173d72 !important;
              --color-calendar-graph-day-L2-bg: #256bc4 !important;
              --color-calendar-graph-day-L3-bg: #4a92ff !important;
              --color-calendar-graph-day-L4-bg: #9dccff !important;
            }
            [fill="#9be9a8"] { fill: #173d72 !important; }
            [fill="#40c463"] { fill: #256bc4 !important; }
            [fill="#30a14e"] { fill: #4a92ff !important; }
            [fill="#216e39"] { fill: #9dccff !important; }
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_leetcode: yes
          plugin_leetcode_user: Vinzr
          plugin_leetcode_sections: solved, skills, recent
          plugin_repositories: yes
          plugin_repositories_featured: GeoCeff/stock-tester-and-simulator, GeoCeff/perk-the-star, GeoCeff/chatgpt-thread-optimizer, GeoCeff/python-automation-toolkit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Update date stamp
        env:
          STATS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run fetch

      - name: Rebuild profile banners and README
        run: npm run build

      - name: Commit updated metrics banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-metrics.svg data/stats.json assets README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update assets/metrics-banner.svg - [Skip GitHub Action]"
            git push
          fi
